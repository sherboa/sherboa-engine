name: sherboa CI/CD

on:
    push:
      branches:
          - main


permissions:
  id-token: write
  contents: read


jobs:
  build:
    name: Build ARM64 image
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository   # Checkout the repository to access the code and Dockerfile for building the image
        uses: actions/checkout@v7

      - name: Debug OIDC subject   # Make sure the OIDC subject is correct for your AWS role trust policy
        uses: actions/github-script@v9
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');   // Get the OIDC token for AWS STS (Security Token Service)
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()   // Decode the JWT (JSON Web Token) payload to inspect its contents
            );
            console.log('OIDC sub:', payload.sub);   // Log the subject claim to verify it matches the expected value in your AWS role trust policy
            console.log('OIDC aud:', payload.aud);   // Log the audience claim to verify it matches the expected value in your AWS role trust policy

      - name: Configure AWS credentials   # Use the OIDC token to assume the specified AWS role for deployment
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::557643338880:role/SherboaGitHubActionsRole
          aws-region: us-east-1

      - name: Login to Amazon ECR   # Authenticate Docker to the Amazon ECR registry to allow pushing the built image
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image   # Build the Docker image and push it to Amazon ECR with a tag based on the current Git commit SHA
        run: |
          IMAGE_URI=557643338880.dkr.ecr.us-east-1.amazonaws.com/sherboa-engine   # Define the ECR repository URI for the sherboa-engine image
          docker build -t $IMAGE_URI:${{ github.sha }} .   # Build the Docker image and tag it with the current Git commit SHA
          docker push $IMAGE_URI:${{ github.sha }}   # Push the tagged Docker image to the Amazon ECR repository
      
      - name: Deploy to EC2 via SSM   # Use AWS Systems Manager (SSM) to deploy the newly built Docker image to the specified EC2 instance
        run: |
          IMAGE_URI=557643338880.dkr.ecr.us-east-1.amazonaws.com/sherboa-engine   # Define the ECR repository URI for the sherboa-engine image
          echo "Deploying Sherboa Engine with image: ${IMAGE_URI}:${{ github.sha }}"   # Log the image URI and tag being deployed for reference
          echo "Deploying to EC2 instance: i-082236ea5c1088e9f"   # Log the EC2 instance ID where the deployment will occur for reference
          echo "Using AWS region: us-east-1"   # Log the AWS region being used for the deployment for reference
          echo "Using AWS role: arn:aws:iam::557643338880:role/SherboaGitHubActionsRole"   # Log the AWS role being assumed for the deployment for reference
          echo "Using GitHub SHA: ${{ github.sha }}"   # Log the current Git commit SHA being used for the deployment for reference
          echo "Using AWS CLI version: $(aws --version)"   # Log the AWS CLI version being used for the deployment for reference
          IMAGE_TAG=${{ github.sha }}   # Define the image tag based on the current Git commit SHA for deployment

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-082236ea5c1088e9f \
            --document-name AWS-RunShellScript \
            --comment "Deploy Sherboa ${IMAGE_TAG}" \
            --parameters "{\"commands\":[\"set -e\",\"aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${IMAGE_URI}\",\"docker pull ${IMAGE_URI}:${IMAGE_TAG}\",\"docker network inspect sherboa-network >/dev/null 2>&1 || docker network create sherboa-network\",\"docker rm -f sherboa-engine 2>/dev/null || true\",\"docker run -d --name sherboa-engine --restart unless-stopped --network sherboa-network -p 8000:8000 ${IMAGE_URI}:${IMAGE_TAG}\",\"for i in {1..10}; do curl -f http://localhost:8000/ && break; sleep 2; done\",\"docker image prune -af\"]}" \
            --query 'Command.CommandId' \
            --output text)   # Output the Command ID of the sent command for reference and tracking its execution status

          echo "SSM Command ID: $COMMAND_ID"   # Log the SSM Command ID for reference and tracking its execution status

          if aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-082236ea5c1088e9f   # Specify the EC2 instance ID where the command was executed to wait for its execution status
          then
            echo "SSM deployment succeeded."   # Log a success message indicating that the SSM deployment completed successfully on the specified EC2 instance
          else
            echo "SSM deployment failed. Fetching invocation details..."   # Log a failure message indicating that the SSM deployment failed and that the invocation details will be fetched for troubleshooting

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-082236ea5c1088e9f \
              --query '{Status:Status,StatusDetails:StatusDetails,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}' \
              --output json   # Output the fetched invocation details in JSON format for easier readability and analysis of the deployment failure

            exit 1
          fi