name: sherboa CI/CD

on:
    push:
      branches:
          - main


permissions:
  id-token: write
  contents: read


jobs:
  build:
    name: Build ARM64 image
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository   # Checkout the repository to access the code and Dockerfile for building the image
        uses: actions/checkout@v7

      - name: Debug OIDC subject   # Make sure the OIDC subject is correct for your AWS role trust policy
        uses: actions/github-script@v9
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');   // Get the OIDC token for AWS STS (Security Token Service)
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()   // Decode the JWT (JSON Web Token) payload to inspect its contents
            );
            console.log('OIDC sub:', payload.sub);   // Log the subject claim to verify it matches the expected value in your AWS role trust policy
            console.log('OIDC aud:', payload.aud);   // Log the audience claim to verify it matches the expected value in your AWS role trust policy

      - name: Configure AWS credentials   # Use the OIDC token to assume the specified AWS role for deployment
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::557643338880:role/SherboaGitHubActionsRole
          aws-region: us-east-1

      - name: Login to Amazon ECR   # Authenticate Docker to the Amazon ECR registry to allow pushing the built image
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image   # Build the Docker image and push it to Amazon ECR with a tag based on the current Git commit SHA
        run: |
          IMAGE_URI=557643338880.dkr.ecr.us-east-1.amazonaws.com/sherboa-engine   # Define the ECR repository URI for the sherboa-engine image
          docker build -t $IMAGE_URI:${{ github.sha }} .   # Build the Docker image and tag it with the current Git commit SHA
          docker push $IMAGE_URI:${{ github.sha }}   # Push the tagged Docker image to the Amazon ECR repository
      
      - name: Deploy to EC2 via SSM   # Use AWS Systems Manager (SSM) to deploy the newly built Docker image to the specified EC2 instance
        run: |
          IMAGE_URI=557643338880.dkr.ecr.us-east-1.amazonaws.com/sherboa-engine
          IMAGE_TAG=${{ github.sha }}
          INSTANCE_ID="${{ vars.SHERBOA_EC2_INSTANCE_ID }}"
          if [ -z "$INSTANCE_ID" ]; then
            echo "ERROR: SHERBOA_EC2_INSTANCE_ID is not configured."
            exit 1
          fi

          echo "Deploying Sherboa Engine: ${IMAGE_URI}:${IMAGE_TAG}"
          echo "Deploying to EC2 instance: ${INSTANCE_ID}"
          echo "Using AWS region: us-east-1"

          COMMANDS=$(jq -n \
            --arg image_uri "$IMAGE_URI" \
            --arg image_tag "$IMAGE_TAG" \
            '{
              commands: [
                "set -e",
                "echo STEP: Authenticate with ECR",
                "aws ecr get-login-password --region us-east-1 | sudo docker login --username AWS --password-stdin \($image_uri)",
                "echo STEP: Pull image \($image_tag)",
                "sudo env IMAGE_TAG=\($image_tag) docker compose -f /opt/sherboa/sherboa-engine/compose.yml pull",
                "echo STEP: Deploy with Docker Compose",
                "sudo env IMAGE_TAG=\($image_tag) docker compose -f /opt/sherboa/sherboa-engine/compose.yml up -d",
                "echo STEP: Wait for Engine health",
                "for attempt in $(seq 1 60); do STATUS=$(sudo docker inspect --format='{{.State.Health.Status}}' sherboa-engine 2>/dev/null || echo missing); echo \"Health check attempt $attempt/60: $STATUS\"; if [ \"$STATUS\" = healthy ]; then echo API_health_check_passed; exit 0; fi; if [ \"$STATUS\" = unhealthy ]; then sudo docker logs --tail 80 sherboa-engine; exit 1; fi; sleep 2; done",
                "echo API_health_check_failed",
                "sudo docker logs --tail 80 sherboa-engine",
                "exit 1"
              ]
            }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy Sherboa ${IMAGE_TAG}" \
            --parameters "$COMMANDS" \
            --query 'Command.CommandId' \
            --output text)   # Output the Command ID of the sent command for reference and tracking its execution status

          echo "SSM Command ID: $COMMAND_ID"   # Log the SSM Command ID for reference and tracking its execution status


          echo "Waiting for SSM deployment to finish..."

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")

            echo "SSM status check $attempt/60: $STATUS"

            case "$STATUS" in
              Success)
                echo "SSM deployment succeeded."

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Status:Status,StandardOutput:StandardOutputContent}' \
                  --output json

                exit 0
                ;;

              Failed|Cancelled|TimedOut)
                echo "SSM deployment failed. Fetching invocation details..."

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Status:Status,StatusDetails:StatusDetails,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}' \
                  --output json

                exit 1
                ;;
            esac

            sleep 5
          done

          echo "ERROR: SSM deployment timed out after approximately 180 seconds."

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,StatusDetails:StatusDetails,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}' \
            --output json || true

          exit 1